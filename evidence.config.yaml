appearance:
  default: light
  switcher: false

theme:
  colorPalettes:
    default:
      light:
        - "#2E6DB4"
        - "#D0393F"
        - "#B07D1E"
      dark:
        - "#2E6DB4"
        - "#D0393F"
        - "#B07D1E"
  colorScales:
    default:
      light:
        - "#ADD8E6"
        - "#00008B"
      dark:
        - "#ADD8E6"
        - "#00008B"
  colors:
    primary:
      light: "#0B1220"
      dark: "#3b82f6"
    accent:
      light: "#B07D1E"
      dark: "#fdba74"
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    "@evidence-dev/duckdb": {}
